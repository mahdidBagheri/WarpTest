services:
  warproxy:
    image: ghcr.io/kingcc/warproxy:latest
    container_name: warproxy
    restart: always
    ports:
      - "127.0.0.1:1080:1080"

  proxy-test:
    build:
      context: .
      dockerfile: Dockerfile
    image: warproxy-proxy-test:local
    profiles:
      - test
    depends_on:
      - warproxy
    environment:
      WARPROXY_URL: socks5h://warproxy:1080
    command: ["test-proxy", "--retries", "12", "--retry-delay", "5"]

  gemini:
    build:
      context: .
      dockerfile: Dockerfile
    image: warproxy-proxy-test:local
    profiles:
      - gemini
    depends_on:
      - warproxy
    env_file:
      - .env
    environment:
      WARPROXY_URL: socks5h://warproxy:1080
    command: ["gemini"]
